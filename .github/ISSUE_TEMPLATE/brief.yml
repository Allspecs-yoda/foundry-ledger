name: Custom brief
description: Specify the exact pack you want. The foundry generates those files.
title: "BRIEF: "
labels: ["brief"]
body:
  - type: markdown
    attributes:
      value: |
        This public issue is the **spec only**. Do **not** put your phone number or email here.

        Start the paid build from the **Workshop** tab: https://allspecs-yoda.github.io/foundry-ledger/#workshop
        Name, phone, and email are collected there and at Stripe checkout so the estimator can file what-for-whom privately.

        Custom price is hours × $75 × complexity after a quote. Catalog desks stay $29–$49.
  - type: input
    id: product_name
    attributes: {label: Product name, placeholder: Wedding Photo Change Desk}
    validations: {required: true}
  - type: input
    id: audience
    attributes: {label: Who it's for}
    validations: {required: true}
  - type: input
    id: niche
    attributes: {label: Niche}
    validations: {required: true}
  - type: textarea
    id: modules
    attributes:
      label: Modules (2–8 names from the catalog)
      description: intake_form, scope_recap, change_order, email_ladder, onboarding_sop, cited_rate_card, quote_sheet, loss_bench, preflight_qa, offer_page, delivery_sop, revision_sop, welcome_3, dunning_4, worked_example
    validations: {required: true}
  - type: dropdown
    id: tone
    attributes: {label: Tone, options: [plain, firm, warm]}
  - type: input
    id: trades
    attributes: {label: Trades (optional, comma-separated), placeholder: photography}
  - type: input
    id: github_handle
    attributes:
      label: GitHub username (delivery)
      description: Public handle only. We invite this username after payment. Phone and email stay on Stripe / Workshop, not this issue.
    validations: {required: true}
